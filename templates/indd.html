<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° Photo Stitcher & Viewer</title>

    <!-- Standard Local Resource Loading -->
    <link rel="stylesheet" href="{{ url_for('static', filename='pannellum.css') }}">
    <script src="{{ url_for('static', filename='pannellum.js') }}"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            text-align: center;
        }
        .upload-section {
            background: #f4f4f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px dashed #ccc;
        }
        #viewer-container {
            display: none;
            margin-top: 20px;
        }
        #panorama-viewer {
            width: 100%;
            height: 500px;
            border-radius: 8px;
            background: #000;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .loading {
            color: blue;
            display: none;
        }
    </style>
</head>
<body>

    <h1>360° Panorama Stitcher & Viewer</h1>
    <p>Upload 2 or more overlapping images to stitch them, then drag your mouse to look around!</p>

    <div class="upload-section">
        <form id="upload-form">
            <input type="file" id="image-input" name="images" multiple accept="image/*" required>
            <br><br>
            <button type="submit">Stitch & View 360°</button>
        </form>
        <div id="loading-msg" class="loading">Stitching images together... please wait...</div>
        <div id="error-msg" class="error"></div>
    </div>

    <!-- 360 Viewer Canvas Wrapper -->
    <div id="viewer-container">
        <h3>Interactive 360° View (Click and drag with your mouse)</h3>
        <div id="panorama-viewer"></div>
    </div>

    <script>
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('image-input');
            const errorMsg = document.getElementById('error-msg');
            const loadingMsg = document.getElementById('loading-msg');
            const viewerContainer = document.getElementById('viewer-container');

            errorMsg.textContent = '';
            viewerContainer.style.display = 'none';

            // Direct check on submission
            if (typeof window.pannellum === 'undefined') {
                errorMsg.innerHTML = '<strong>Error:</strong> The file was read by the server but could not be parsed as JavaScript. Please open your browser console (Press F12) to read the exact red error message.';
                return;
            }

            if (fileInput.files.length < 2) {
                errorMsg.textContent = 'Please select at least 2 overlapping images.';
                return;
            }

            const formData = new FormData();
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('images', fileInput.files[i]);
            }

            loadingMsg.style.display = 'block';

            try {
                const response = await fetch('/stitch', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                loadingMsg.style.display = 'none';

                if (data.success) {
                    viewerContainer.style.display = 'block';
                    
                    window.pannellum.viewer('panorama-viewer', {
                        "type": "equirectangular",
                        "panorama": data.image_url,
                        "autoLoad": true,
                        
                        
                        "compass": false
                    });
                } else {
                    errorMsg.textContent = data.error || 'Stitching failed.';
                }
            } catch (err) {
                loadingMsg.style.display = 'none';
                errorMsg.innerHTML = `<strong>Network Connection Failed:</strong> ${err.message}`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
